name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Test before publishing
        run: go vet ./... && go test ./...

      - name: Build every target
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA::7} -X main.buildDate=${DATE}"
          mkdir -p dist/WowBackup/backups

          # Command-line builds. The names match the portable folder, so
          # self-update can map a local file to its release asset.
          build() { GOOS=$1 GOARCH=$2 go build -trimpath -ldflags="$LDFLAGS" -o "dist/WowBackup/$3" . ; }
          build windows amd64 wowbak.exe
          build windows arm64 wowbak-arm64.exe
          build darwin  arm64 wowbak-macos
          build darwin  amd64 wowbak-macos-intel
          build linux   amd64 wowbak-linux
          build linux   arm64 wowbak-linux-arm64

          # Double-click launchers: no console on Windows, a bundle on macOS.
          GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags="$LDFLAGS -H windowsgui" -o dist/WowBackup/WowBackup.exe .
          APP=dist/WowBackup/WowBackup.app/Contents
          mkdir -p "$APP/MacOS"
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o /tmp/wb-arm .
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o /tmp/wb-amd .
          cp /tmp/wb-arm "$APP/MacOS/WowBackup"   # lipo is unavailable on Linux runners
          cat > "$APP/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>WowBackup</string>
            <key>CFBundleDisplayName</key><string>WowBackup</string>
            <key>CFBundleIdentifier</key><string>local.wowbak.app</string>
            <key>CFBundleExecutable</key><string>WowBackup</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSUIElement</key><true/>
          </dict>
          </plist>
          PLIST

          cp README.md LICENSE dist/WowBackup/
          dist/WowBackup/wowbak-linux config init >/dev/null 2>&1 || true

      - name: Package
        run: |
          cd dist
          zip -qr "WowBackup-${GITHUB_REF_NAME}.zip" WowBackup
          cd WowBackup
          for f in wowbak.exe wowbak-arm64.exe wowbak-macos wowbak-macos-intel \
                   wowbak-linux wowbak-linux-arm64 WowBackup.exe; do
            [ -f "$f" ] && cp "$f" "../$f"
          done
          cd ..
          sha256sum WowBackup-*.zip wowbak* WowBackup.exe > checksums.txt
          ls -la

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/WowBackup-*.zip \
            dist/wowbak.exe dist/wowbak-arm64.exe \
            dist/wowbak-macos dist/wowbak-macos-intel \
            dist/wowbak-linux dist/wowbak-linux-arm64 \
            dist/WowBackup.exe \
            dist/checksums.txt
